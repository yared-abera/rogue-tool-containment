version = "1.0"

[task]
name = "yared/rogue-tool-containment"
description = "Harden a toy agent runtime against unauthorized tool use and sandbox escape."
authors = [{ name = "Yared Abera", email = "yaredoabera@gmail.com" }]

[metadata]
author_name = "Yared Abera"
author_email = "yaredoabera@gmail.com"
difficulty = "hard"
category = "security"
tags = ["security", "sandbox", "prompt-injection", "tool-use", "containment"]

[agent]
timeout_sec = 72000.0
user = "agent"

[verifier]
timeout_sec = 900.0
user = "root"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
